annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Compute marginal grid emissions factor (gCO2/kWh) to time industrial
  loads with cleanest power.
input_schema:
  additionalProperties: false
  properties:
    grid_region:
      type: string
    hour_of_day:
      type: number
  required:
  - grid_region
  - hour_of_day
  type: object
name: calculate-marginal-carbon-intensity
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
