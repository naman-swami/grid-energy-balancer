annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Forecast hourly renewable generation based on numerical solar irradiance
  and wind speed telemetry.
input_schema:
  additionalProperties: false
  properties:
    ambient_temp_c:
      type: number
    capacity_mw:
      type: number
    solar_irradiance:
      type: number
  required:
  - capacity_mw
  - solar_irradiance
  type: object
name: forecast-solar-wind-generation
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
