annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate optimal Battery Energy Storage System charge/discharge schedule.
input_schema:
  additionalProperties: false
  properties:
    capacity_mwh:
      type: number
    current_soc_percent:
      type: number
    day_ahead_prices:
      type: string
  required:
  - current_soc_percent
  - day_ahead_prices
  - capacity_mwh
  type: object
name: optimize-bess-dispatch
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
